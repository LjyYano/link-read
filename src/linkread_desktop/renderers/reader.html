<style id="linkread-reader-extensions">
/* Keep the reading column at the top, independent of the active tab's height. */
.main{margin:0 auto;align-self:start}
.hero h1,.transcript-section h2,.transcript-section h3{overflow-wrap:anywhere}
.transcript-section h3{font-size:18px;margin:26px 0 12px;line-height:1.5}
.reading-paragraph.unpolished{border-left:2px solid var(--line);padding-left:12px}
.reading-paragraph{scroll-margin-top:94px}
.keyword-atlas {
  --cloud-blue:#284997;--cloud-violet:#67439e;--cloud-teal:#176257;
  --cloud-berry:#96396c;--cloud-gold:#89501d;--cloud-indigo:#465ba6;
  --cloud-surface:#f8f9ff;--cloud-halo:#fff;--cloud-focus:#1d2d56;
  --cloud-blue-glow:#e1ebff;--cloud-violet-glow:#eee2fc;--cloud-green-glow:#e2f3ee;
  background:radial-gradient(ellipse at 19% 15%,var(--cloud-blue-glow),transparent 52%),
    radial-gradient(ellipse at 85% 68%,var(--cloud-violet-glow),transparent 57%),
    radial-gradient(ellipse at 30% 94%,var(--cloud-green-glow),transparent 54%),var(--cloud-surface);
  border:1px solid var(--line);border-radius:19px;
  padding:clamp(18px,3.5vw,32px) clamp(17px,3.5vw,32px);
}
[data-theme=dark] .keyword-atlas {
  --cloud-blue:#a5bdff;--cloud-violet:#cfacf8;--cloud-teal:#8edac9;
  --cloud-berry:#f7a7d1;--cloud-gold:#edc090;--cloud-indigo:#b5bae9;
  --cloud-surface:#191b28;--cloud-halo:#242b42;--cloud-focus:#f7f7ff;
  --cloud-blue-glow:#242e51;--cloud-violet-glow:#32233e;--cloud-green-glow:#1a3436;
}
.keyword-cloud {
  position:relative;display:flex;flex-wrap:wrap;align-items:center;
  justify-content:center;align-content:center;gap:9px 16px;min-height:110px;
}
.cloud-word {
  --word-tone:var(--cloud-blue);
  position:relative;display:block;flex:0 1 auto;max-width:100%;min-height:36px;
  padding:4px 6px;border:0;border-radius:9px;background:transparent;color:var(--word-tone);
  font-size:calc(15px + 41px * var(--weight));font-weight:calc(540 + 200 * var(--weight));
  line-height:1.18;letter-spacing:-.025em;overflow-wrap:anywhere;text-align:center;
}
.cloud-tone-1{--word-tone:var(--cloud-violet)}.cloud-tone-2{--word-tone:var(--cloud-teal)}
.cloud-tone-3{--word-tone:var(--cloud-berry)}.cloud-tone-4{--word-tone:var(--cloud-gold)}
.cloud-tone-5{--word-tone:var(--cloud-indigo)}
.cloud-word::before {
  content:"";position:absolute;inset:-2px -6px;border-radius:11px;opacity:0;pointer-events:none;
  background:color-mix(in srgb,var(--word-tone) 11%,var(--cloud-halo));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--word-tone) 27%,transparent),
    0 5px 18px color-mix(in srgb,var(--word-tone) 22%,transparent);
  transform:scale(.91);transition:opacity .18s ease,transform .24s ease-out;
}
.cloud-label {
  position:relative;display:block;pointer-events:none;
  transition:color .18s ease,transform .24s cubic-bezier(.2,.65,.3,1.18);
}
.cloud-word:hover,.cloud-word:focus-visible{z-index:1;color:var(--cloud-focus)}
.cloud-word:hover::before,.cloud-word:focus-visible::before{opacity:1;transform:scale(1)}
.cloud-word:hover .cloud-label,.cloud-word:focus-visible .cloud-label{transform:translateY(-1px) scale(var(--cloud-zoom,1.1))}
.keyword-cloud.is-positioned{display:block}
.keyword-cloud.is-positioned .cloud-word{position:absolute;margin:0}
@media(max-width:790px){.cloud-word{font-size:calc(14px + 30px * var(--weight));min-height:44px}}
@media(prefers-reduced-motion:reduce){
  .cloud-word::before,.cloud-label{transition:none}
  .cloud-word:hover .cloud-label,.cloud-word:focus-visible .cloud-label{transform:none}
}

.reading-tools button{padding:4px 9px;color:var(--muted)}.reading-tools #print-page{margin-left:auto}
.shownotes-source{color:var(--muted);font-size:12px;margin:0 0 23px}
.shownotes-copy{font-size:15px;line-height:1.9;overflow-wrap:anywhere}
.shownotes-copy>:first-child{margin-top:0}.shownotes-copy p,.shownotes-copy div{margin:0 0 1em}.shownotes-copy ul,.shownotes-copy ol{padding-left:1.6em}
.shownotes-copy h2,.shownotes-copy h3,.shownotes-copy h4,.shownotes-copy h5,.shownotes-copy h6{font-size:17px;line-height:1.5;margin:1.5em 0 .6em}
.shownotes-copy blockquote{border-left:3px solid var(--line);margin:1em 0;padding-left:1em;color:var(--muted)}
.shownotes-copy pre{white-space:pre-wrap;background:var(--surface);padding:12px;border-radius:6px}.shownotes-plain{white-space:pre-wrap}
.shownotes-copy a,.shownotes-source a,.shownotes-empty a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.shownotes-empty{padding:22px 0;color:var(--muted);font-size:14px}.shownotes-empty p{margin-top:0}.shownotes-empty-actions{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
[data-refresh-shownotes][hidden]{display:none}
.reading-resume{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:13px;max-width:calc(100vw - 28px);padding:9px 12px;background:var(--bg);border:1px solid var(--line);border-radius:9px;box-shadow:0 3px 18px #0000000f;color:var(--fg);font-size:12px;line-height:1.5}
.reading-resume[hidden]{display:none}.reading-resume>span{white-space:nowrap}.reading-resume button{border:0;background:transparent;color:var(--accent);padding:4px 0;font-size:12px;white-space:nowrap}
.reading-resume [data-reading-start-top]{border-left:1px solid var(--line);padding-left:13px}.reading-resume [data-reading-resume-dismiss]{color:var(--muted);padding:3px 4px;font-size:18px;line-height:1}
@media(prefers-reduced-motion:reduce){.tab{transition:none}}

.quote-translation{margin:0 0 10px;font-size:.95em;color:var(--muted)}
.quote-translation>span{display:block;font-size:.75em;font-weight:650}
@media print{
  .shell{display:block}.main{padding:0}
  .sidebar,.crumb,.tabs,.toolbar,.reading-tools,.reading-actions,.mobile-toc,#toast,.reading-resume,.panel:not(#panel-transcript){display:none!important}
  #panel-transcript{display:block!important}
}
</style>
<!--LR:MINDMAP_STYLE-->
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span>▤</span><!--LR:SIDEBAR_HOME--></div>
    <!--LR:SIDEBAR_TOC-->
    <div class="sidebar-bottom"><button class="theme-btn" type="button" aria-label="Toggle theme">◐　Theme</button></div>
  </aside>
  <main class="main">
    <nav class="crumb"><!--LR:HOME--><!--LR:CATEGORY--><button type="button" class="theme-btn" aria-label="Toggle theme">◐</button></nav>
    <header class="hero"><h1><!--LR:TITLE--></h1><!--LR:METADATA--><!--LR:READING_ACTIONS--></header>
    <div class="tabs">
      <div class="reader-tab-row">
        <div class="reader-tab-strip">
          <button class="tab-scroll-button" id="reader-tabs-left" type="button" aria-label="Scroll tabs left" title="Scroll tabs left" aria-controls="reader-tab-list" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
          <div class="tabs-scroll" id="reader-tab-list" role="tablist" aria-label="Article views"><!--LR:TABS--></div>
          <button class="tab-scroll-button" id="reader-tabs-right" type="button" aria-label="Scroll tabs right" title="Scroll tabs right" aria-controls="reader-tab-list" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
        </div>
        <div class="reader-tool-buttons" role="group" aria-label="Reading tools">
          <button class="reader-tool-button" id="reader-search-toggle" type="button" aria-label="Search article" title="Search article (⌘F / Ctrl+F)" aria-controls="reader-search" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button>
          <div class="reader-tool">
            <button class="reader-tool-button reader-aa" id="reader-appearance-toggle" type="button" aria-label="Reading appearance" title="Reading appearance" aria-controls="reader-appearance" aria-expanded="false">Aa</button>
            <div class="reader-popover" id="reader-appearance" role="group" aria-label="Reading appearance" hidden>
              <span class="reader-popover-heading">Reading appearance</span>
              <span class="reader-popover-label">Text size</span>
              <div class="reader-size-controls"><button type="button" id="font-decrease" aria-label="Decrease font size">A−</button><span id="font-status" role="status"></span><button type="button" id="font-increase" aria-label="Increase font size">A+</button></div>
              <div class="reader-appearance-group" role="group" aria-label="Line width"><span class="reader-popover-label">Line width</span><div class="reader-segmented"><button type="button" data-reading-width="standard" aria-pressed="true">Standard</button><button type="button" data-reading-width="wide" aria-pressed="false">Wide</button></div></div>
              <div class="reader-appearance-group" role="group" aria-label="Line spacing"><span class="reader-popover-label">Line spacing</span><div class="reader-segmented"><button type="button" data-reading-spacing="compact" aria-pressed="false">Compact</button><button type="button" data-reading-spacing="relaxed" aria-pressed="true">Relaxed</button></div></div>
              <button class="reader-reset" type="button" id="font-reset">Reset appearance</button>
              <span class="reader-appearance-status" id="appearance-status" role="status">Transcript &amp; Shownotes · Saved across articles</span>
            </div>
          </div>
          <div class="reader-tool reader-export">
            <button class="reader-tool-button" id="reader-export-toggle" type="button" aria-label="Export article" title="Export article" aria-controls="reader-export" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3m-4 4 4-4 4 4M5 12v8h14v-8"/></svg></button>
            <div class="reader-popover reader-export-menu" id="reader-export" role="group" aria-label="Export article" hidden><button type="button" id="print-page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 17H3V9h18v8h-3M6 14h12v7H6z"/></svg>Print / Save PDF</button></div>
          </div>
        </div>
      </div>
      <div class="reader-search" id="reader-search" role="search" aria-label="Search article" hidden>
        <label class="reader-search-field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="text-search" type="search" placeholder="Search Transcript &amp; Shownotes" aria-label="Search Transcript and Shownotes" aria-describedby="reader-search-help" autocomplete="off" spellcheck="false" maxlength="500"></label>
        <span id="match-count" role="status" aria-live="polite" aria-atomic="true"></span>
        <div class="reader-search-nav"><button type="button" id="search-prev" aria-label="Previous match" title="Previous match (Shift+Enter)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 14 6-6 6 6"/></svg></button><button type="button" id="search-next" aria-label="Next match" title="Next match (Enter)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 10 6 6 6-6"/></svg></button></div>
        <button type="button" id="search-close" aria-label="Close search" title="Close search (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
        <span class="reader-visually-hidden" id="reader-search-help">Searches saved Transcript and Shownotes locally. Enter moves to the next match; Shift+Enter moves to the previous match; Escape closes search.</span>
      </div>
    </div>
    <!--LR:SUMMARY_PANEL-->
    <!--LR:MINDMAP_PANEL-->
    <section class="panel active" id="panel-transcript" data-panel="transcript" role="tabpanel" aria-labelledby="tab-transcript">
      <div class="panel-inner">
        <!--LR:MOBILE_TOC-->
        <!--LR:READING_NOTICE-->
        <article class="article-body"<!--LR:READING_SIGNATURE-->><!--LR:ARTICLE--></article>
      </div>
    </section>
    <!--LR:KEYWORDS_PANEL-->
    <!--LR:HIGHLIGHTS_PANEL-->
    <!--LR:SHOWNOTES_PANEL-->
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div class="reading-resume" data-reading-resume role="status" aria-live="polite" hidden><span>Resumed reading</span><button type="button" data-reading-start-top>Start from top</button><button type="button" data-reading-resume-dismiss aria-label="Dismiss reading reminder">×</button></div>
<script type="application/json" id="linkread-reader-labels"><!--LR:READER_LABELS--></script>
<script id="linkread-reader-init">
<!--LR:READER_SCRIPT-->
</script>
<!--LR:MINDMAP_SCRIPTS-->
</body>
</html>

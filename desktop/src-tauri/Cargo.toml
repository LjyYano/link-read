[package]
name = "linkread-desktop"
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.14.1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "process", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL"] }

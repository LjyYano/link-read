<!-- Keep the exported HTML's original horizontal tabs and chapter TOC.
     Desktop adds only native integrations, never replaces the reader layout. -->
<style>
/* The app toolbar already provides navigation back to the bookshelf. */
.linkread-desktop .crumb { display: none; }
.linkread-desktop .sidebar .brand { display: none; }
.linkread-desktop .sidebar { padding-top: 18px; }
.linkread-desktop .theme-btn { display: none; }
.linkread-desktop [data-reading-actions] { display: none; }
.linkread-desktop [data-refresh-shownotes] { display: inline-flex; }
/* Old archives use margin:auto, which vertically centers short tabs in Grid. */
.linkread-desktop .main { margin: 0 auto; align-self: start; padding-top: 30px; }
.linkread-desktop .tabs { top: 0; }
@media (max-width: 790px) {
  .linkread-desktop .main { padding-top: 20px; }
}
</style>
<script>
(() => {
  "use strict";
  window.__linkreadDesktop = true;
  document.documentElement.classList.add("linkread-desktop");
  const isAllowedHostOrigin = origin =>
    origin === "null" || origin === "tauri://localhost" || origin === "https://tauri.localhost"
    || /^http:\/\/(?:localhost|127\.0\.0\.1)(?::\d+)?$/.test(origin);

  const systemTheme = matchMedia("(prefers-color-scheme: dark)");
  const themeKey = "linkread-desktop-theme";
  const validTheme = value => value === "light" || value === "sepia" || value === "dark";
  let theme = null;
  try { theme = localStorage.getItem(themeKey); } catch {}
  function applyTheme() {
    const effectiveTheme = validTheme(theme) ? theme : systemTheme.matches ? "dark" : "light";
    document.documentElement.dataset.theme = effectiveTheme;
    window.linkreadSyncThemeButtons?.();
    window.parent.postMessage({ linkReadTheme: effectiveTheme }, "*");
  }
  applyTheme();
  systemTheme.addEventListener("change", applyTheme);
  window.addEventListener("message", event => {
    if (event.source !== window.parent || !isAllowedHostOrigin(event.origin)) return;
    if (typeof event.data?.linkReadEscapeRequest === "string" && /^[0-9]{1,20}$/.test(event.data.linkReadEscapeRequest)) {
      const handled = window.linkreadCloseReaderLayer?.() === true;
      window.parent.postMessage({ linkReadEscapeResult: { id: event.data.linkReadEscapeRequest, handled } }, "*");
      return;
    }
    if (event.data?.linkReadCommand === "set-theme" && validTheme(event.data.theme)) {
      theme = event.data.theme;
      applyTheme();
      try { localStorage.setItem(themeKey, theme); } catch {}
      return;
    }
    if (event.data?.linkReadCommand !== "toggle-theme") return;
    theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    applyTheme();
    try { localStorage.setItem(themeKey, theme); } catch {}
  });

  document.addEventListener("click", event => {
    if (!event.isTrusted || !(event.target instanceof Element)) return;
    const link = event.target.closest("a[href]");
    if (!link) return;
    if (link.protocol === "https:" || link.protocol === "http:") {
      event.preventDefault();
      window.parent.postMessage({ linkReadExternal: link.href }, "*");
    } else if (link.hasAttribute("href") && !link.getAttribute("href").startsWith("#")
      && !link.getAttribute("href").startsWith("mailto:")) {
      // Relative bookshelf links cannot resolve inside the custom reader scheme.
      event.preventDefault();
      window.parent.postMessage({ linkReadGoBack: true }, "*");
    }
  });
  document.addEventListener("keydown", event => {
    const key = event.key.toLowerCase();
    if (!event.isTrusted || event.defaultPrevented ||
        event.isComposing || event.keyCode === 229 || event.altKey || (key === "escape" && event.repeat) ||
        !(key === "escape" || ((event.metaKey || event.ctrlKey) && (key === "o" || key === "," || key === "k" || key === "\\")))) return;
    event.preventDefault();
    window.parent.postMessage({ linkReadShortcut: key === "escape" ? "Escape" : key }, "*");
  });
})();
</script>
